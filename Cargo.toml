[package]
name = "dpomo"
version = "1.0.0"
edition = "2024"
description = "A beautiful, customizable and lightweight Pomodoro timer built with Rust + egui."
license = "MIT"
repository = "https://github.com/diegorezm/dpomo"
readme = "README.md"
keywords = ["pomodoro", "timer", "egui", "productivity"]
categories = ["gui"]

# Linux .deb package (cargo deb). See .github/workflows/release.yml.
[package.metadata.deb]
name = "dpomo"
maintainer = "diegorezm <dmourarezende@gmail.com>"
section = "utils"
extended-description = "A beautiful, customizable and lightweight Pomodoro timer with an axolotl companion. Lives in the system tray and sends notifications."
# Graphics libs are loaded at runtime (dlopen), so cargo-deb can't see them.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libgl1, libegl1, libasound2"
# curl is only used for the daily update check.
recommends = "curl"
assets = [
    ["target/release/dpomo", "usr/bin/", "755"],
    ["packaging/linux/dpomo.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/dpomo.png", "644"],
    ["README.md", "usr/share/doc/dpomo/README.md", "644"],
]

[dependencies]
# glow (OpenGL) instead of the default wgpu: much smaller binary and faster startup.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# System tray. On Linux the KSNI (D-Bus) backend avoids a GTK dependency.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# Native desktop notifications (toast / D-Bus / NotificationCenter).
notify-rust = "4.18.2"
# "Start with the system" (registry Run key / .desktop autostart / LaunchAgent).
auto-launch = "0.6.0"
# Phase-end sounds. Only playback + common formats for custom files.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "vorbis"] }
# Local date for statistics ("today", "this week").
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Picks the UI language from the OS when `language = "auto"`.
sys-locale = "0.3"
# Parses the GitHub API answer of the update check (fetched with the OS's curl).
serde_json = "1"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
# Window handle for coloring the title bar (already in the tree via eframe).
raw-window-handle = "0.6"
# Fallback renderer when OpenGL is missing (VMs, remote desktop, Windows on ARM):
# Direct3D 12 only, with its software rasterizer. Not used on a normal PC.
eframe = { version = "0.37.0", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std"] }
# Registers an AppUserModelID so toasts say "dpomo" (already in the tree via auto-launch).
windows-registry = "0.6.1"
# Trims the working set while hidden; colors the title bar (already in the tree via winit).
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
png = "0.17"
