# Builds installers for every OS and publishes them as a GitHub Release.
#
# Release:  bump `version` in Cargo.toml, commit, then
#             git tag v0.2.0 && git push origin v0.2.0
# Dry run:  Actions tab → Release → "Run workflow" (builds artifacts, no release).
#
# File names are stable (no version) so README links to
# releases/latest/download/<file> always work.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Code signing turns on once the SignPath variable/secret exist (see AGENTS.md).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Sign pomolotl.exe first (it goes inside the installer), then the installer.
      - name: Upload unsigned exe
        id: unsigned-exe
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: target/release/pomolotl.exe
      - name: Sign exe (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pomolotl
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Qp "/DAppVersion=$version" packaging\windows\pomolotl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned installer
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/pomolotl-setup.exe
      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pomolotl
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path target\release\pomolotl.exe, LICENSE, README.md -DestinationPath dist\pomolotl-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: dist/*

  linux:
    strategy:
      matrix:
        include:
          # Older Ubuntu = older glibc = the binary runs on more distros.
          - { runner: ubuntu-22.04, deb: amd64, tar: x86_64 }
          - { runner: ubuntu-22.04-arm, deb: arm64, tar: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cargo deb --no-build --output dist/pomolotl-linux-${{ matrix.deb }}.deb
          mkdir -p pkg/pomolotl
          cp target/release/pomolotl packaging/linux/pomolotl.desktop assets/icon.png LICENSE README.md pkg/pomolotl/
          tar -C pkg -czf dist/pomolotl-linux-${{ matrix.tar }}.tar.gz pomolotl
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-${{ matrix.deb }}
          path: dist/*

  macos:
    runs-on: macos-latest
    env:
      # Developer ID signing + notarization turn on once the Apple secrets exist (see AGENTS.md).
      NOTARIZE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Import Developer ID certificate
        if: env.NOTARIZE == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
      - name: App bundle + dmg
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=dmg/Pomolotl.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/pomolotl" \
            target/aarch64-apple-darwin/release/pomolotl target/x86_64-apple-darwin/release/pomolotl
          cp assets/icon.icns "$app/Contents/Resources/pomolotl.icns"
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          if [ "$NOTARIZE" = true ]; then
            codesign --force --options runtime --timestamp --sign "Developer ID Application" "$app"
          else
            # Ad-hoc signature: not notarized, but required to run on Apple Silicon.
            codesign --force --deep --sign - "$app"
          fi
          ln -s /Applications dmg/Applications
          hdiutil create -volname Pomolotl -srcfolder dmg -ov -format UDZO dist/pomolotl-macos.dmg
      - name: Notarize dmg
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --timestamp --sign "Developer ID Application" dist/pomolotl-macos.dmg
          xcrun notarytool submit dist/pomolotl-macos.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/pomolotl-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: dist/*

  # Smoke tests: install each package on a fresh runner and run a real
  # 1-minute pomodoro (packaging/smoke/). Screenshots + logs are uploaded as
  # "smoke-*" artifacts. Nothing is published unless they all pass.
  smoke-windows:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-windows
          path: dist
      - run: packaging/smoke/smoke-windows.ps1 dist/pomolotl-setup.exe smoke
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke

  smoke-linux:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: amd64 }
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-linux-${{ matrix.arch }}
          path: dist
      # Installing the .deb with apt proves its declared dependencies resolve.
      - run: sudo apt-get update && sudo apt-get install -y ./dist/pomolotl-linux-${{ matrix.arch }}.deb xvfb dunst imagemagick libgl1-mesa-dri
      - run: dbus-run-session -- bash packaging/smoke/smoke-linux.sh smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke

  smoke-macos:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-macos
          path: dist
      - run: bash packaging/smoke/smoke-macos.sh dist/pomolotl-macos.dmg smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, smoke-windows, smoke-linux, smoke-macos]
    runs-on: ubuntu-latest
    steps:
      # Only the packages (pkg-*): not the unsigned intermediates or smoke screenshots.
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pomolotl $GITHUB_REF_NAME" \
            --generate-notes
